name: build

# Builds whisper.cpp for Windows x64 as two self-contained server binaries:
# one with the Vulkan backend, one processor-only. Upstream ships no Windows
# Vulkan binary, so this is the only practical way to get one without a
# local toolchain. Both are built with BUILD_SHARED_LIBS=OFF and /MT, so a
# clean machine without the Visual C++ redistributable can still start them.

on:
  push:
    branches: [main]
    tags: ["engine-vulkan-*"]
  workflow_dispatch:
    inputs:
      whisper_build:
        description: "whisper.cpp release tag (leave empty for latest)"
        required: false
        default: ""
  schedule:
    # Weekly, to pick up new whisper.cpp builds without anyone pushing.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pin which upstream build to compile. A tag build is immutable, so
      # it must not resolve "latest" at build time: engine-vulkan-b5454-static
      # ships whisper.cpp v1.9.5, and rebuilding that tag years later has to
      # produce the same source. Manual runs may name a tag; scheduled runs
      # follow upstream deliberately.
      - name: Resolve whisper.cpp build
        id: whisper
        run: |
          $tag = "${{ github.event.inputs.whisper_build }}"
          if (-not $tag -and "${{ github.ref }}" -like "refs/tags/*") {
            $tag = "v1.9.5"
          }
          if (-not $tag) {
            $rel = Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest"
            $tag = $rel.tag_name
          }
          "build=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "whisper.cpp build: $tag"

      - name: Checkout whisper.cpp sources
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.whisper.outputs.build }}
          submodules: recursive
          path: whisper.cpp

      - name: Install Vulkan SDK
        run: |
          choco install vulkan-sdk --version=1.4.363.0 -y
          # The SDK installer can return before the environment is readable.
          $sdk = "C:\VulkanSDK\1.4.363.0"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) {
            Write-Error "glslc.exe missing from $sdk\Bin"
          }

      # One script for local and CI. It builds SPIRV-Headers, configures and
      # compiles both backends, stages the package, and runs the import
      # guard against the staged bytes.
      - name: Build the runtime
        run: |
          .\build.ps1 -BuildDir build-vulkan -CpuBuildDir build-cpu -DistDir dist\runtime

      - name: Package
        run: |
          $zip = "dist\whisper-vulkan-win-x64-${{ steps.whisper.outputs.build }}.zip"
          Compress-Archive -Path "dist\runtime\*" -DestinationPath $zip
          Get-ChildItem "dist\runtime" | Select-Object Name, Length

      - name: Checksums
        run: |
          $zip = "dist\whisper-vulkan-win-x64-${{ steps.whisper.outputs.build }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          Write-Host $hash

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-win-x64-${{ steps.whisper.outputs.build }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/engine-vulkan-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
